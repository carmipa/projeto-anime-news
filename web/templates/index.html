<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>AnimeBot News - Status</title>
    <style>
        body {
            font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif;
            background: #1a1a1a;
            color: #fff;
            display: flex;
            justify-content: center;
            align-items: center;
            height: 100vh;
            margin: 0;
        }

        .card {
            background: #2d2d2d;
            padding: 2rem;
            border-radius: 12px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            width: 300px;
        }

        h1 {
            color: #ff6b6b;
            margin-top: 0;
            text-align: center;
        }

        .stat {
            display: flex;
            justify-content: space-between;
            margin: 10px 0;
            border-bottom: 1px solid #444;
            padding-bottom: 5px;
        }

        .stat:last-child {
            border-bottom: none;
        }

        .val {
            font-weight: bold;
            color: #4ecdc4;
        }

        .status-dot {
            height: 10px;
            width: 10px;
            background-color: #2ecc71;
            border-radius: 50%;
            display: inline-block;
            margin-right: 5px;
        }
    </style>
</head>

<body>
    <div class="card">
        <h1><span class="status-dot"></span>AnimeBot</h1>
        <div class="stat"><span>Uptime</span><span class="val" id="uptime">Loading...</span></div>
        <div class="stat"><span>Scans</span><span class="val" id="scans">0</span></div>
        <div class="stat"><span>News Sent</span><span class="val" id="news">0</span></div>
        <div class="stat"><span>Cache Hits</span><span class="val" id="cache">0</span></div>
        <div class="stat"><span>Last Scan</span><span class="val" id="last">Never</span></div>
    </div>

    <script>
        async function fetchStats() {
            try {
                const response = await fetch('/api/stats');
                const data = await response.json();
                document.getElementById('uptime').textContent = data.uptime;
                document.getElementById('scans').textContent = data.scans;
                document.getElementById('news').textContent = data.news_posted;
                document.getElementById('cache').textContent = data.cache_hits;
                document.getElementById('last').textContent = new Date(data.last_scan).toLocaleTimeString();
            } catch (e) {
                console.error(e);
            }
        }
        setInterval(fetchStats, 5000);
        fetchStats();
    </script>
</body>

</html>
