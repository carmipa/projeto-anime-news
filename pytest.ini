# Catraca da suite.
#
# POR QUE EXISTE: em 2026-09-18 a prova das duas linhas mostrou que
# `def test_x(): return False` PASSAVA neste bot -- so um warning. Um teste que
# faz return em vez de assert e incapaz de reprovar, e conta na contagem como
# se medisse alguma coisa. No cyberseguranca-py isso escondeu 13 testes assim,
# um deles aprovando com ZERO fontes carregadas.
#
# Medido antes de ligar: com a catraca ativa os 132 testes existentes seguem
# passando. Ou seja, nenhum teste atual e incapaz de reprovar -- isto fecha o
# risco futuro, nao mascara divida presente.
[pytest]
testpaths = tests
python_files = test_*.py
filterwarnings =
    error::pytest.PytestReturnNotNoneWarning
