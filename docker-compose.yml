services:
  anime-bot:
    build: .
    container_name: anime-news-bot
    restart: unless-stopped

    # Variáveis de ambiente (do arquivo .env)
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo

    # Volumes para persistir dados
    # ATENÇÃO ao subir: bind mount de ARQUIVO que não existe no host faz o
    # Docker criar um DIRETÓRIO com aquele nome, e aí o bot não consegue mais
    # ler nem escrever. Antes do primeiro `up`, garanta que existem:
    #   for f in config.json history.json state.json audit.jsonl; do
    #     [ -f "$f" ] || echo '{}' > "$f"
    #   done
    #   [ -s audit.jsonl ] && : || : > audit.jsonl
    volumes:
      # Arquivos de configuração e histórico
      - ./config.json:/app/config.json
      - ./history.json:/app/history.json
      - ./state.json:/app/state.json
      - ./sources.json:/app/sources.json

      # Trilha de auditoria: sem este volume, todo o histórico de eventos de
      # segurança e configuração morre a cada `up --build`.
      - ./audit.jsonl:/app/audit.jsonl

      # Timezone do host
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

      # Logs persistentes (opcional)
      - ./logs:/app/logs

    # Configuração de logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Política de restart
    # unless-stopped: reinicia sempre, exceto se parado manualmente

    # Healthcheck: ver healthcheck.py (prova de vida do processo, não
    # existência de ficheiro montado por volume).
    healthcheck:
      test: [ "CMD", "python", "/app/healthcheck.py" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

    # Labels para organização
    labels:
      com.anime-bot.description: "AnimeBootNews System"
      com.anime-bot.version: "3.0"
