services:
  anime-bot:
    build: .
    container_name: anime-news-bot
    restart: unless-stopped

    # Variáveis de ambiente (do arquivo .env)
    env_file:
      - .env
    environment:
      - TZ=America/Sao_Paulo
      # Estado de runtime num volume de DIRETÓRIO (./data): é o que permite a
      # escrita atômica (os.replace). Bind mount de arquivo único dá EBUSY.
      - DATA_DIR=/app/data

    # Volumes para persistir dados
    volumes:
      # Estado de runtime (config.json, history.json, state.json, audit.jsonl) num
      # único DIRETÓRIO. Antes eram bind mounts de ARQUIVO único, onde o rename
      # atômico (os.replace) é impossível — dava EBUSY e caía no fallback não-atômico,
      # deixando history.json exposto a corromper num kill no meio da escrita.
      # A app resolve estes caminhos via DATA_DIR=/app/data (ver utils/storage.p).
      - ./data:/app/data

      # Catálogo de fontes: versionado, atualizado por git pull; o bot só o LÊ,
      # então bind mount de arquivo único aqui não tem problema de escrita.
      - ./sources.json:/app/sources.json

      # Timezone do host
      - /etc/localtime:/etc/localtime:ro
      - /etc/timezone:/etc/timezone:ro

      # Logs persistentes (opcional)
      - ./logs:/app/logs

    # Configuração de logs
    logging:
      driver: "json-file"
      options:
        max-size: "10m"
        max-file: "3"

    # Política de restart
    # unless-stopped: reinicia sempre, exceto se parado manualmente

    # Healthcheck: ver healthcheck.py (prova de vida do processo, não
    # existência de ficheiro montado por volume).
    healthcheck:
      test: [ "CMD", "python", "/app/healthcheck.py" ]
      interval: 60s
      timeout: 10s
      retries: 3
      start_period: 120s

    # Labels para organização
    labels:
      com.anime-bot.description: "AnimeBootNews System"
      com.anime-bot.version: "3.0"
